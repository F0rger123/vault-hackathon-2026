# Local deployment. Ports bind to 127.0.0.1 only; nothing is exposed to the network.
# Model inference uses Ollama on the host by default (see docs/DEPLOYMENT.md).
# To run Ollama in a container instead: docker compose --profile ollama up
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_DATA_DIR: /data
      VAULT_OLLAMA_URL: ${VAULT_OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - vault-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_VAULT_API: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  vault-data:
  ollama-models:
