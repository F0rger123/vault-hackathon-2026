[project]
name = "vault"
version = "0.1.0"
description = "VAULT: private, local-first document intelligence and workflow platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.2",
    "pillow>=10.3",
    "psutil>=5.9",
    "typer>=0.12",
    # F12.11: AES-256-GCM for encrypted transfer packs. pyca/cryptography, the standard audited library.
    "cryptography>=44",
    # F08.6: share packs are written as clean, newly drawn PDFs.
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
vault = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "cli", "generator", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"generator/**" = ["S311", "E501"]
# Reviewed: these modules interpolate only module constants (LATEST_EXTRACTION, migration numbers)
# or a pydantic Literal column name into SQL. All user values are bound parameters. See docs/SECURITY.md.
"backend/api/routes.py" = ["S608"]
"backend/indexing/search.py" = ["S608"]
"backend/storage/db.py" = ["S608"]
"backend/workers/proposals.py" = ["S608"]

[tool.bandit]
skips = ["B608"]
