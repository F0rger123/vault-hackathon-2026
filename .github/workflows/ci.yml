name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so newly published vulnerabilities show up without a code change

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (unit, integration, security)
        run: pytest -p no:warnings
      - name: Bandit
        run: bandit -q -c pyproject.toml -r backend cli -ll
      - name: Dataset is deterministic
        # PNG stamps are excluded: their pixels depend on the Pillow/FreeType build, not on the seed.
        run: |
          python -m generator.generate --out /tmp/regen --seed 2026
          diff <(cd data/synthetic/v1 && find . -type f ! -name '*.png' | sort | xargs sha256sum) <(cd /tmp/regen && find . -type f ! -name '*.png' | sort | xargs sha256sum)
      - name: Dataset v2 is deterministic
        # Scanned pages (*-SCN-*.pdf) embed rendered pixels, so they are excluded like the PNG stamps.
        run: |
          python -m generator.generate --out /tmp/regen2 --seed 2026 --dataset-version 2
          diff <(cd data/synthetic/v2 && find . -type f ! -name '*.png' ! -name '*-SCN-*' | sort | xargs sha256sum) <(cd /tmp/regen2 && find . -type f ! -name '*.png' ! -name '*-SCN-*' | sort | xargs sha256sum)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build

  # Keeps the files that let a fresh agent session resume valid (coordination/AGENT_COMMUNICATION_PROTOCOL.md).
  coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Coordination files
        if: github.event_name != 'pull_request'
        run: python scripts/check_coordination.py
      - name: Coordination files and PR task ID
        if: github.event_name == 'pull_request'
        # Passed through env, never interpolated into the script, so PR text cannot inject shell commands.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_coordination.py --pr-title "$PR_TITLE" --pr-body "$PR_BODY"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pip setuptools && pip install -e . pip-audit && pip-audit --skip-editable
      - run: cd frontend && npm audit --audit-level=high

  # Static analysis beyond ruff/bandit: Python, TypeScript/React/Next.js, Dockerfiles and committed secrets.
  # Images are pinned by digest so a compromised tag cannot change what runs here.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --error --metrics=off
          --config p/python --config p/typescript --config p/react --config p/nextjs
          --config p/dockerfile --config p/secrets
          --exclude data --exclude frontend/node_modules --exclude frontend/.next

  trivy:
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository (lockfiles, Dockerfiles, secrets)
        run: >
          docker run --rm -v "$PWD:/src" $TRIVY fs --quiet --exit-code 1
          --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --skip-dirs /src/data /src
      - name: Build images
        run: docker compose build
      - name: Scan images
        # --ignore-unfixed: base-image packages with no released fix are listed in docs/SECURITY.md instead.
        run: |
          for img in backend frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY image --quiet --exit-code 1 \
              --ignore-unfixed --severity HIGH,CRITICAL vault-hackathon-2026-$img:latest
          done

  # Browser tests (F11.5): seeds a fresh demo, starts the API and a production UI build, runs Playwright.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
        env:
          VAULT_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
